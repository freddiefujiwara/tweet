<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Xに投稿</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xに投稿" />
    <meta property="og:description" content="X（@freddiefujiwara）への投稿ページ" />
    <meta property="og:url" content="https://freddiefujiwara.com/tweet/" />
    <meta property="og:image" content="https://freddiefujiwara.com/tweet/ogp.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Xに投稿" />
    <meta name="twitter:description" content="X（@freddiefujiwara）への投稿ページ" />
    <meta name="twitter:image" content="https://freddiefujiwara.com/tweet/ogp.png" />
    <link rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle' fill='white' font-family='system-ui'%3EF%3C/text%3E%3C/svg%3E" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" crossorigin src="/tweet/staging/assets/index-Am3QCVhQ.js"></script>
    <link rel="stylesheet" crossorigin href="/tweet/staging/assets/index-CCq9uuZ_.css">
  </head>
  <body>
    <div class="layout">
      <header class="header">
        <h1>Xに投稿</h1>
        <div class="header-actions">
          <div class="header-buttons">
            <button id="theme-toggle" class="theme-toggle" type="button">ライト</button>
            <button id="logout" class="theme-toggle" type="button" hidden>ログアウト</button>
          </div>
        </div>
      </header>
      <main>
        <section id="gate" class="table-wrap auth-gate">
          <h2 class="section-title">Googleログインが必要です</h2>
          <p class="meta">許可されたアカウントでサインインしてください。</p>
          <div id="signin" class="google-login-button"></div>
          <p id="gate-error" class="error"></p>
        </section>
        <section id="share-expired" class="table-wrap auth-gate" hidden>
          <h2 class="section-title">リンクの有効期限が切れています</h2>
          <p class="meta">この一時アクセスリンクは無効か、期限切れです。発行者に新しいリンクを依頼してください。</p>
        </section>
        <section id="composer" class="table-wrap" hidden>
          <p id="account" class="meta"></p>
          <textarea id="text" rows="5" placeholder="投稿する文面"></textarea>
          <div class="composer-row">
            <span class="meta"><span id="count">0</span> / 280</span>
            <button id="post" class="post-button" type="button" disabled>投稿する</button>
          </div>
          <div id="status"></div>
        </section>
        <section id="inbox" class="table-wrap" hidden>
          <div class="inbox-header">
            <h2 class="section-title">コメント</h2>
            <button id="inbox-refresh" class="theme-toggle" type="button">更新</button>
          </div>
          <p id="inbox-note" class="meta" hidden></p>
          <div id="inbox-status"></div>
          <div id="inbox-list"></div>
          <p id="inbox-empty" class="meta" hidden>コメントはありません。</p>
        </section>
        <section id="dm" class="table-wrap" hidden>
          <div class="inbox-header">
            <h2 class="section-title">DM</h2>
            <button id="dm-refresh" class="theme-toggle" type="button">更新</button>
          </div>
          <p id="dm-note" class="meta" hidden></p>
          <div id="dm-status"></div>
          <div id="dm-list"></div>
          <p id="dm-empty" class="meta" hidden>DMはありません。</p>
        </section>
        <section id="share-card" class="table-wrap" hidden>
          <h2 class="section-title">一時アクセスリンク</h2>
          <p class="meta">ログイン不要で1か月間このページを使えるURLを発行します。新しいURLを発行すると、前のURLは無効になります。この画面を閉じると発行したURLは再表示できません。</p>
          <div id="share-issued" hidden>
            <p>
              <strong id="share-remaining"></strong>
              <span class="meta">（<span id="share-expires"></span> まで有効）</span>
            </p>
            <div class="share-url-row">
              <input id="share-url" class="share-url-input" type="text" readonly aria-label="一時アクセスURL" />
              <button id="share-copy" class="theme-toggle" type="button">URLをコピー</button>
            </div>
            <div class="composer-row">
              <button id="share-reissue" class="theme-toggle" type="button">新しいURLを発行し直す</button>
              <button id="share-revoke" class="theme-toggle" type="button">今すぐ無効化する</button>
            </div>
          </div>
          <p id="share-issue-row">
            <button id="share-issue" class="theme-toggle" type="button">1か月間有効なURLを発行</button>
          </p>
          <p id="share-status" class="meta"></p>
        </section>
      </main>
    </div>

  </body>
</html>
