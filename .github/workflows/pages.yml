name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 20.x
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - run: npm install
    - run: npm test
    - run: npm run build

    - name: Build staging variant into dist/staging
      env:
        VITE_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbzzDOks_JT7YtfWufq15ERqQHqd1144s23YNa0-ZsFPnjOwAn_v_-m0kRVqAlKsGcKNug/exec"
        VITE_STAGING: "1"
      run: |
        npm run build:staging
        mkdir -p dist/staging
        cp -r dist-staging/* dist/staging/

    - name: Generate OGP Image from GAS JSON
      if: github.event_name == 'push'
      run: |
        # URL-encoded title: Xに投稿
        JSON_RESPONSE=$(curl -L -s "https://script.google.com/macros/s/AKfycbzbMAKxkzHlwN8SY7ygJA34xYESMNNdkGNt8vv1XMcZSksgHsUwOxCCdP-wgg6fv7M/exec?t=X%E3%81%AB%E6%8A%95%E7%A8%BF")
        echo $JSON_RESPONSE | jq -r '.png' | base64 -d > ./dist/ogp.png
        ls -lh ./dist/ogp.png

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
